components:
  schemas:
    JobStatus:
      type: string
      enum:
      - queued
      - finished
      - failed
      - started
      - deferred
      - scheduled
      - stopped
      - canceled
      title: JobStatus
      description: The Status of Job within its lifecycle at any given time.
    DatasetOverlapDistributionCreate:
      properties:
        strategy:
          type: string
          enum:
          - overlap
          const: overlap
          title: Strategy
        min_submitted:
          type: integer
          minimum: 1.0
          title: Min Submitted
          description: Minimum number of submitted responses to consider a record as completed
      type: object
      required:
      - strategy
      - min_submitted
      title: DatasetOverlapDistributionCreate
    DatasetCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: Dataset name
        guidelines:
          title: Guidelines
          type:
          - string
          - 'null'
          maxLength: 10000
          minLength: 1
          description: Dataset guidelines
        allow_extra_metadata:
          type: boolean
          title: Allow Extra Metadata
          default: true
        distribution:
          $ref: '#/components/schemas/DatasetOverlapDistributionCreate'
          default:
            strategy: overlap
            min_submitted: 1
        metadata:
          title: Metadata
          type:
          - object
          - 'null'
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
      type: object
      required:
      - name
      - workspace_id
      title: DatasetCreate
    IntegerMetadataPropertyCreate:
      properties:
        min:
          title: Min
          type:
          - integer
          - 'null'
        max:
          title: Max
          type:
          - integer
          - 'null'
        type:
          type: string
          enum:
          - integer
          const: integer
          title: Type
      type: object
      required:
      - type
      title: IntegerMetadataPropertyCreate
    TermsMetadataPropertyCreate:
      properties:
        type:
          type: string
          enum:
          - terms
          const: terms
          title: Type
        values:
          title: Values
          items: {}
          type:
