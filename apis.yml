description: >
  Argilla is an open-source data annotation and curation platform designed for
  AI engineers and domain experts building high-quality datasets for LLMs and
  NLP models. The platform provides a FastAPI-based REST API for managing
  workspaces, datasets, records, responses, suggestions, and vectors, enabling
  RLHF and preference tuning pipelines. Developers interact with Argilla through
  a Python SDK (pip install argilla) or directly via REST using API key
  authentication. Argilla supports deployment on Hugging Face Spaces, Docker,
  and self-hosted environments, and is licensed under Apache-2.0. The platform
  recently joined Hugging Face, deepening its integration with the broader open
  ML ecosystem.
